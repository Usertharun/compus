name: Compus validation
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check repository lint
        run: npm run lint
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: compus_test
          POSTGRES_USER: compus
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U compus -d compus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://compus:test-only-password@localhost:5432/compus_test
      DATABASE_URL_UNPOOLED: postgresql://compus:test-only-password@localhost:5432/compus_test
      JWT_SECRET: ci-only-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      HEALTH_MAX_HEAP_MB: 1024
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm test -- --runInBand
      - name: Run database-backed end-to-end tests
        shell: bash
        run: |
          if ! npm run test:e2e -- --runInBand; then
            stage=$(cat e2e-stage.txt 2>/dev/null || true)
            case "$stage" in
              app-compile|app-init|health-request|health-failure-memory|health-failure-database|health-failure-unknown|health-status-200|health-status-500|health-status-503|health-status-other|health-body|registration|onboarding|refresh|logout|password-reset)
                echo "::error title=End-to-end test stage failed::$stage"
                ;;
              *)
                echo "::error title=End-to-end test failed::No lifecycle stage was reached"
                ;;
            esac
            exit 1
          fi
      - name: Verify persisted product flows in isolated database
        run: node -r ts-node/register -r tsconfig-paths/register test/product.integration.ts
      - run: docker build -t compus-backend:ci .
