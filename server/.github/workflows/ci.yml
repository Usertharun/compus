name: Compus Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-and-build:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: ESLint Compliance Check
        run: npm run lint

      - name: Execute Unit & Integration Test Suite
        run: npm run test

      - name: Compile NestJS Server Application
        run: npm run build

      - name: Verify Multi-Stage Docker Image Build
        run: docker build -t compus-server-test:latest .
